# EXPERIMENTAL DEVICE-LIMITS BRANCH — LOCAL ONLY.
# Deliberately isolated from the production Worker and D1.
# Do not deploy this configuration. Use local Wrangler development only.

name = "parscloud-subscription-server-device-limits-local"
main = "src/index.ts"
compatibility_date = "2026-10-22"

[[d1_databases]]
binding = "DB"
database_name = "parscloud-device-limits-local-test"
