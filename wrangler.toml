# STAGING ONLY — isolated Worker and D1 database.
# This branch is dedicated to the Cloudflare staging deployment.
# Never change this binding to Production or deploy from another branch.

name = "parscloud-device-limits-staging"
main = "src/index.ts"
compatibility_date = "2026-10-22"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "parscloud-device-limits-staging"
database_id = "7811e712-1ea4-409b-b44e-ea6a3c78f14c"
migrations_dir = "migrations"

[vars]
DEVICE_LIMITS_ENFORCED = "true"
